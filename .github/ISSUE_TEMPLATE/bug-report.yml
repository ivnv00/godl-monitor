name: Bug report
description: Report an issue without sharing wallet or RPC credentials.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md rather than opening an issue. Remove wallet/derived addresses, transaction signatures, RPC URLs/API keys, balances and local paths. Use synthetic examples."
  - type: input
    id: version
    attributes:
      label: App and macOS version
      placeholder: "App version or commit · macOS version"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple silicon
        - Intel
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How did you install it?
      options:
        - Privately supplied DMG or ZIP
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include minimal steps, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional. Do not attach an Application Support directory or raw accounting history.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal wallet data, credentials and identifying paths from this report and its attachments.
          required: true
