name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The private alpha uses local preflight; no hosted runner minutes are consumed.
  # Standard hosted jobs become eligible only after an owner-approved public launch.
  native:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Apple silicon runner
        run: test "$(uname -m)" = arm64
      - name: Swift tests
        run: python3 scripts/check.py --suite native
  native-intel:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify Intel runner
        run: test "$(uname -m)" = x86_64
      - name: Swift tests
        run: python3 scripts/check.py --suite native
  engine:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Locked dependencies
        run: npm ci --ignore-scripts --prefix engine
      - name: Engine, packaging, docs and privacy
        run: python3 scripts/check.py --suite portable
